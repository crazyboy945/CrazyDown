[package]
name = "crazydown"
version = "0.1.0"
edition = "2024"
description = "Fast multi-protocol downloader (HTTP/HTTPS/FTP/BitTorrent) with resume and segmented downloads"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.31.1", default-features = false }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
indicatif = "0.18.6"
librqbit = { version = "9.0.1", default-features = false }
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-crypto-hash"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "charset", "http2", "system-proxy"] }
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
suppaftp = { version = "12.2.1", default-features = false }
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = "0.7.20"
url = "2.5.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
